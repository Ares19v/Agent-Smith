version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    container_name: agent-smith-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: agent-smith-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/agents_data:/app/agents_data
      - ./.env:/app/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
